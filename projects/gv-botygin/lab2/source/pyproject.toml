[project]
name = "doc-rag"
version = "0.1.0"
description = "RAG по PDF-документам: индексация в Qdrant и FastAPI-сервис поиска"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.2",
    "uvicorn>=0.41.0",
    "sentence-transformers>=3.0",
    "torch>=2.6",
    "qdrant-client>=1.17.0",
    "langchain-text-splitters>=1.1.1",
    "pdfplumber>=0.11.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.25.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doc_rag"]
