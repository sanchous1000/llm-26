# Default indexing configuration. Override single values on the command line:
#   python -m source index --set chunking.chunk_size=2048 --set embedding.mode=dense
chunking:
  splitter: structured        # structured | recursive | fixed
  tokenizer: BAAI/bge-m3      # chunk sizes are measured in this tokenizer's tokens
  chunk_size: 1024            # tokens; see README "Chunking" for the size study
  overlap: 0                  # tokens (whole units for the structured splitter)
  split_level: 2              # headings up to this level start a new chunk
  min_chunk_tokens: 128       # smaller chunks are merged into their neighbour
  include_headings: true      # prepend "title + section path" to the embedded text
  strip_images: true          # drop image links from the embedded text
  include_references: false   # skip the bibliography section

embedding:
  model: BAAI/bge-m3
  mode: hybrid                # dense | sparse | hybrid
  device: auto                # auto -> mps on Apple Silicon
  dtype: float16
  max_length: 8192
  batch_tokens: 16384         # token budget of one forward pass

index:                        # Qdrant collection
  distance: cosine
  hnsw_m: 16                  # chosen by `hnsw-bench` (see eval/REPORT.md)
  hnsw_ef_construct: 64
  hnsw_ef: 64                 # search-time beam width
  on_disk: false

min_priority: 3               # catalog stars (1-3) a document needs to be indexed

rag:                          # question answering (ask / chat / mcp)
  top_k: 5                    # passages retrieved per question
  mode: auto                  # auto = hybrid for English queries, dense otherwise
  max_context_tokens: 6000    # budget for passages in the prompt
  model: opencode-go/deepseek-v4.1-flash   # served through `opencode run`
  llm_timeout_s: 300
  history_turns: 3            # previous Q/A pairs kept in a chat prompt
  snippet_chars: 320          # length of the quoted snippet per citation
