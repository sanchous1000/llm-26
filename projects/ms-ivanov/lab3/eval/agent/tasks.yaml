          Static OT: Peyre & Cuturi (Brenier), Gangbo & McCann. Rates: Weed & Bach. Flow matching:
          Lipman et al., Pooladian et al. Schroedinger bridges: Tong et al. ([SF]^2M), Shi et al. (DSBM).
