# Task set for the lab 3 agents: a research assistant for the thesis
# "Unsupervised Distribution Transfer" working over the papers-rag corpus.
#
# Every task is a list of turns (a single-turn task has one). Per turn:
#   user                - the user's message
#   expected_output     - reference answer / success criterion for the judge
#   must_include        - optional key facts for a deterministic check; each item is a
#                         string or a list of alternatives (case-insensitive substring)
#   depends_on_history  - the answer needs earlier turns of the dialog
#   memory_probe        - the answer needs facts from the *early* part of a long dialog
#                         (the part a context-limited agent is likely to have shortened)
#   expected_tools      - tools a good solution calls (search_papers, get_chunk_context,
#                         list_documents, get_document_outline, calculator)
#   reference_docs      - doc_keys of the corpus documents that contain the answer
#   check               - optional: "exact" when must_include fully decides success
# Ground truth was checked against data/papers/<kind>/<key>/document.md on 2026-10-29.

tasks:
  # ------------------------------------------------------------------ single turn
  - id: S01-gangbo-mccann-assumptions
    type: single
    difficulty: easy
    category: fact_lookup
    source: thesis
    language: en
    turns:
      - user: >-
          My thesis uses the Gangbo-McCann theorem (Theorem 1.2 of "The geometry of optimal
          transportation") to get a unique optimal map inside each component. Find it in the corpus:
          what exactly are the hypotheses (H1)-(H3) on h, what is assumed about the source measure,
          and what does the theorem conclude?
        expected_output: >-
          Gangbo & McCann 1996, Theorem 1.2 (strictly convex costs): cost c(x,y)=h(x-y) with
          (H1) h: R^d -> [0,inf) strictly convex; (H2) a cone condition (given a height r and an angle
          theta, for p far enough from the origin one can find a cone with vertex p on which h is
          bounded above by h(p)); (H3) superlinear growth h(x)/|x| -> +inf as |x| -> inf. mu and nu are
          Borel probability measures and mu is absolutely continuous w.r.t. Lebesgue. Conclusions:
          (i) there is a c-concave psi such that s = id - (grad h)^{-1} o grad psi pushes mu to nu;
          (ii) s is unique mu-a.e.; (iii) (id x s)#mu is optimal; (iv) it is the only optimal measure
          unless the total cost is infinite. Examples: quadratic costs <x,Px> with P positive definite,
          radial costs growing faster than linearly.
        must_include: [["strictly convex"], ["superlinear", "h(x)/|x|", "faster than linear"], ["absolutely continuous", "lebesgue"], ["unique"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [gangbo1996geometry]

  - id: S02-anai-prop43-claim-check
    type: single
    difficulty: medium
    category: claim_check
    source: thesis
    language: en
    turns:
      - user: >-
          An earlier draft of my thesis says: "By Anai et al. (DTM-based filtrations), Proposition 4.3,
          for measures mu, nu with compact supports X, Y the weighted Cech filtrations of the DTM satisfy
          d_i(V[X, d_mu], V[Y, d_nu]) <= r_min^{-1} (m^{-1/2} W_2(mu, nu) + 2^{1/p} d_H(X, Y)),
          where r_min is the minimal curvature radius of the supports." Is this statement correct as
          a citation? Check it against the source and give the correct form.
        expected_output: >-
          Not correct. Anai et al. (2018), Proposition 4.3 states
          d_i(V[X,d_mu], V[Y,d_nu]) <= m^{-1/2} W_2(mu,nu) + 2^{1/p} d_H(X,Y), with no curvature-radius
          factor r_min^{-1}; the only assumption is that mu, nu have compact supports X, Y. For finite
          X, Y with empirical measures it gives d_i(W[X],W[Y]) <= m^{-1/2} W_2(X,Y) + 2^{1/p} d_H(X,Y).
          The proof combines Prop. 3.3 (stability w.r.t. X, using that the DTM is 1-Lipschitz) and
          Prop. 3.2 with Prop. 4.2 (||d_mu - d_nu||_inf <= m^{-1/2} W_2).
        must_include: [["not correct", "incorrect", "no curvature", "does not contain", "not in the source", "no such factor", "there is no"], ["2^{1/p}", "2^{\\frac{1}{p}}", "2^(1/p)"], ["m^{-1/2}", "m^{-\\frac{1}{2}}", "m^(-1/2)"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [anai2018dtmbased]

  - id: S03-rips-theorem-parameters
    type: single
    difficulty: hard
    category: fact_lookup_with_computation
    source: thesis
    language: en
    turns:
      - user: >-
          Find the theorem of Chazal and Oudot (Towards persistence-based reconstruction in Euclidean
          spaces) that recovers the homology of offsets X^lambda from a pair of nested Rips complexes.
          State it. Then check a concrete case: the sample L is at Hausdorff distance eps = wfs(X)/20
          from X. Is the Rips parameter alpha = wfs(X)/5 admissible, and which two Rips complexes do I
          compare?
        expected_output: >-
          Theorem 3.6: X compact, L finite with d_H(X,L) < eps for some eps < wfs(X)/9. Then for all
          alpha in [2 eps, (wfs(X) - eps)/4] and all lambda in (0, wfs(X)), H_k(X^lambda) is isomorphic
          to im j_*, where j_*: H_k(R^alpha(L)) -> H_k(R^{4 alpha}(L)) is induced by inclusion.
          Case: eps = 0.05 wfs < wfs/9 ~ 0.111 wfs, so the theorem applies; admissible
          alpha in [0.1 wfs, 0.2375 wfs]; alpha = 0.2 wfs is admissible. Compare R^{0.2 wfs}(L) with
          R^{0.8 wfs}(L).
        must_include: [["3.6"], ["4\\alpha", "4 alpha", "4α", "0.8"], ["0.2375", "0.237", "0.24", "19/80"], ["admissible", "yes", "valid", "satisf"]]
        expected_tools: [search_papers, get_chunk_context, calculator]
        reference_docs: [chazal2007towards]

  - id: S04-weed-bach-rate
    type: single
    difficulty: hard
    category: fact_lookup_with_computation
    source: thesis
    language: en
    turns:
      - user: >-
          According to Weed & Bach ("Sharp asymptotic and finite-sample rates of convergence of
          empirical measures in Wasserstein distance"), what is the upper bound on E W_p(mu, mu_n) and
          how is the upper Wasserstein dimension related to the Minkowski dimension? For a measure
          supported on a set of Minkowski dimension 6 and p = 2, what rate do I get, and roughly how
          many times more samples do I need to halve the expected W_2 error?
        expected_output: >-
          Theorem 1: for p in [1, inf) and any s > d_p^*(mu), E[W_p(mu, mu_n)] <~ n^{-1/s} (lower bound
          n^{-1/t} for t < d_*(mu)). d_p^* is defined (Definition 4) only above 2p; Proposition 2:
          d_H <= d_* <= d_p^*, and if d_M(mu) >= 2p then d_p^*(mu) <= d_M(mu). Here d_M = 6 >= 2p = 4,
          so d_2^* <= 6 and E W_2 <~ n^{-1/s} for every s > 6 (about n^{-1/6}). Halving the error needs
          about 2^s ~ 2^6 = 64 times more samples (slightly more since s > 6).
        must_include: [["n^{-1/s}", "n^{-\\frac{1}{s}}", "n^(-1/s)"], ["64", "2^6"], ["2p"]]
        expected_tools: [search_papers, get_chunk_context, calculator]
        reference_docs: [weed2017sharp]

  - id: S05-stability-theorems-comparison
    type: single
    difficulty: hard
    category: multi_doc_synthesis
    source: own
    language: en
    turns:
      - user: >-
          Compare three stability results for persistence diagrams that are in the corpus:
          Cohen-Steiner, Edelsbrunner & Harer (2007), Chazal, de Silva, Glisse & Oudot ("The structure
          and stability of persistence modules"), and Bauer & Lesnick ("Induced matchings ...").
          For each: setting/assumptions, the statement, and what is new compared to the earlier ones.
        expected_output: >-
          (1) Cohen-Steiner et al. 2007, Main Theorem: X triangulable, f, g continuous tame functions;
          d_B(D(f), D(g)) <= ||f - g||_inf (proved via Hausdorff stability / Box Lemma, then bottleneck).
          (2) Chazal et al. 2012: self-contained theory of persistence modules over R; persistence
          diagrams constructed via measure theory; weaker taming hypotheses (q-tame) suffice for
          existence and stability; algebraic stability via interleavings (delta-interleaved modules
          have diagrams at bottleneck distance <= delta). (3) Bauer & Lesnick 2013: explicit induced
          matching from a morphism of pointwise finite-dimensional modules; quality controlled by the
          longest intervals of ker f and coker f; new constructive proof of algebraic stability in which
          a delta-interleaving morphism induces a delta-matching of barcodes; single-morphism
          characterization of interleavings.
        must_include: [["tame"], ["||f - g||", "\\|f-g\\|", "sup norm", "l_\\infty", "infinity norm", "∞"], ["interleav"], ["q-tame", "weaker"], ["induced matching", "matching"]]
        expected_tools: [search_papers, list_documents, get_chunk_context]
        reference_docs: [cohensteiner2007stability, chazal2012structure, bauer2013induced]

  - id: S06-memoli-abstention
    type: single
    difficulty: medium
    category: abstention
    source: thesis
    language: en
    turns:
      - user: >-
          Quote Theorem 5.1 of Memoli (2011), "Gromov-Wasserstein distances and the metric approach to
          object matching", from the corpus, with its exact assumptions.
        expected_output: >-
          The full text of Memoli (2011) is not available in the corpus (list_documents finds no such
          document; it is only cited by other papers), so the agent cannot quote its Theorem 5.1 and
          must say so instead of inventing a statement. A good answer may point to corpus papers that
          discuss GW distances (e.g. Chowdhury & Memoli 2018, Memoli & Needham 2022, Chen et al. 2022),
          clearly marking that they are secondary sources.
        must_include: [["not in the corpus", "not available", "not indexed", "no such document", "could not find", "cannot quote", "not found", "isn't in", "is not in"]]
        expected_tools: [list_documents, search_papers]
        reference_docs: []

  - id: S07-hartigan-secondary-source
    type: single
    difficulty: medium
    category: abstention_secondary_source
    source: thesis
    language: en
    turns:
      - user: >-
          My Theorem T-B(i) uses single linkage clustering. What did Hartigan (1981, "Consistency of
          single linkage for high-density clusters") prove about single linkage? Use the corpus and say
          where the information comes from.
        expected_output: >-
          Hartigan (1981) itself is not in the corpus. A secondary source in the corpus, Eldridge,
          Belkin & Wang (2015, "Beyond Hartigan Consistency"), says that Hartigan proved that single
          linkage clustering is not (Hartigan-)consistent in dimensions larger than one; Chaudhuri et al.
          (2014, Section 2.3) add that Hartigan introduced the weaker fractional consistency, which
          single linkage achieves under a density-ratio condition (Penrose 1995); robust single
          linkage (Chaudhuri & Dasgupta 2010) and tree pruning (Kpotufe & von Luxburg 2011) were later
          shown to be consistent (analysed in Chaudhuri et al. 2014). The answer must flag that this is
          second-hand.
        must_include: [["not consistent", "inconsistent", "not hartigan-consistent"], ["eldridge", "chaudhuri"], ["not in the corpus", "secondary", "second-hand", "not available", "indirect", "not indexed"]]
        expected_tools: [list_documents, search_papers]
        reference_docs: [eldridge2015beyond, chaudhuri2014consistent]

  - id: S08-chazal-catalog
    type: single
    difficulty: easy
    category: catalog
    source: own
    language: en
    turns:
      - user: >-
          How many documents in the corpus have Frederic Chazal as the first author (judge by the
          document keys)? Which one is the earliest and which has the latest publication year?
        expected_output: >-
          12 documents with keys starting with "chazal". Earliest: "Towards Persistence-Based
          Reconstruction in Euclidean Spaces" (Chazal & Oudot, 2007, chazal2007towards). Latest year:
          "An introduction to Topological Data Analysis: fundamental and practical aspects for data
          scientists" (Chazal & Michel, 2021, Frontiers in AI, chazal2017introduction).
        must_include: [["12", "twelve"], ["Towards Persistence-Based Reconstruction", "chazal2007towards"], ["introduction to Topological Data Analysis", "chazal2017introduction"]]
        check: exact
        expected_tools: [list_documents]
        reference_docs: []

  - id: S09-gw-embedding-catalog
    type: single
    difficulty: medium
    category: catalog
    source: own
    language: en
    turns:
      - user: >-
          Among the corpus documents with "Gromov" in the title, which ones carry both the GW and the
          EMB catalogue tags? Give titles and years.
        expected_output: >-
          Four documents: Alvarez-Melis & Jaakkola, "Gromov-Wasserstein Alignment of Word Embedding
          Spaces" (2018); Kawakita et al., "Gromov-Wasserstein unsupervised alignment reveals structural
          correspondences between the color similarity structures of humans and large language models"
          (2024); Yang et al., "Improving Hyperbolic Representations via Gromov-Wasserstein
          Regularization" (2024); Wu et al., "Multimodal Alignment Through Joint Kernel Entropic
          Gromov--Wasserstein Optimal Transport" (2026).
        must_include: [["Word Embedding"], ["color similarity", "Kawakita"], ["Hyperbolic"], ["Multimodal Alignment", "Joint Kernel"]]
        check: exact
        expected_tools: [list_documents]
        reference_docs: [alvarezmelis2018gromovwasserstein, kawakita2023gromovwasserstein, yang2024improving, wu2026multimodal]

  - id: S10-cyclegan-training
    type: single
    difficulty: easy
    category: fact_lookup
    source: own
    language: en
    turns:
      - user: >-
          In the original CycleGAN paper, what weight lambda is put on the cycle-consistency loss in all
          experiments, and what optimizer, batch size and learning-rate schedule are used?
        expected_output: >-
          Zhu et al. 2017: lambda = 10 in Equation 3 for all experiments; Adam, batch size 1, learning
          rate 0.0002 kept for the first 100 epochs and linearly decayed to zero over the next 100
          epochs; networks trained from scratch.
        must_include: [["10"], ["adam"], ["0.0002", "2e-4"], ["100"]]
        check: exact
        expected_tools: [search_papers]
        reference_docs: [zhu2017unpaired]

  - id: S11-hierarchical-ot-two-levels
    type: single
    difficulty: medium
    category: method_explanation
    source: thesis
    language: en
    turns:
      - user: >-
          My thesis says that the two-level architecture (match clusters, then points) is not new and
          cites hierarchical OT (Lee et al. 2019). Find that paper and explain precisely how its
          objective encodes the two levels, which transformation class it uses and how it is optimised.
        expected_output: >-
          Lee et al. 2019, "Hierarchical Optimal Transport for Multimodal Distribution Alignment":
          min over P in the Birkhoff polytope B_S and T of sum_ij P_ij W_2^2(T(mu_i), nu_j); the outer
          level (P) resolves cluster correspondences, the inner Wasserstein distance resolves point-wise
          correspondences (a nested/block OT). T is restricted to the Stiefel manifold (isometric /
          orthogonal maps), assuming principal angles between subspaces are preserved. Entropic
          regularization on P and all Q_ij (Sinkhorn); non-convex problem solved by distributed ADMM
          (per-pair transformations R_ij + consensus step weighted by P_ij): algorithm HiWA.
        must_include: [["birkhoff"], ["stiefel", "orthogonal", "isometr"], ["admm"], ["entrop", "sinkhorn"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [lee2019hierarchical]

  - id: S12-brenier-ru
    type: single
    difficulty: medium
    category: abstention_secondary_source
    source: thesis
    language: ru
    turns:
      - user: >-
          В тезисе я ссылаюсь на теорему Бренье (Brenier 1991, «Polar factorization and monotone
          rearrangement of vector-valued functions»). Есть ли эта статья в корпусе? Если нет, найди
          формулировку теоремы во вторичном источнике из корпуса и укажи, откуда она.
        expected_output: >-
          Оригинальной статьи Бренье 1991 в корпусе нет (в каталоге есть только ссылка без текста).
          Формулировка есть во вторичных источниках, например: Peyré & Cuturi, «Computational Optimal
          Transport», Remark 2.24 (Monge–Kantorovich equivalence — Brenier theorem): для квадратичной
          стоимости c(x,y)=||x-y||^2 в R^d и меры alpha с плотностью оптимальная связка единственна и
          сосредоточена на графике отображения T = grad phi, где phi — выпуклая функция, единственная с
          точностью до константы, (grad phi)#alpha = beta; или Vesseron & Cuturi 2024, Theorem 2.1
          (полярное разложение F = grad u o M, u выпукла, M сохраняет меру). Принимается любой
          корректно процитированный вторичный источник. Ответ должен явно сказать, что источник
          вторичный.
        must_include: [["нет", "отсутств", "not in"], ["Peyr", "Cuturi", "Computational Optimal Transport", "вторичн"], ["выпукл", "convex", "градиент", "gradient", "nabla"]]
        expected_tools: [list_documents, search_papers]
        reference_docs: [peyre2018computational]

  - id: S13-fathi-oxtoby-ulam
    type: single
    difficulty: medium
    category: claim_check
    source: thesis
    language: en
    turns:
      - user: >-
          I cite Fathi (1980) for the von Neumann-Oxtoby-Ulam theorem on compact connected manifolds.
          What is a "good measure" in that paper, what exactly does its Theorem 3.1 say, and does the
          homeomorphism it gives fix the boundary?
        expected_output: >-
          Fathi 1980, Definition 1.3: a measure on X is good if it is a probability measure without atoms
          whose support is the whole X. Theorem 3.1 (von Neumann-Oxtoby-Ulam): if M^n is a compact
          connected manifold and mu, nu are good measures on M^n (in the theorem's setting, vanishing on
          the boundary), there is a homeomorphism h of M^n with h|_{boundary} = id and h_* mu = nu. So
          yes, h is the identity on the boundary. The scanned text is noisy, so the answer should rely on
          the readable parts and may note the OCR noise.
        must_include: [["atom"], ["support"], ["homeomorphism"], ["boundary", "∂M", "\\partial"]]
        expected_tools: [search_papers, get_document_outline, get_chunk_context]
        reference_docs: [fathi1980structure]

  - id: S14-shrestha-mpa
    type: single
    difficulty: medium
    category: method_explanation
    source: thesis
    language: en
    turns:
      - user: >-
          Why can CycleGAN-type distribution matching learn a content-misaligned translation, and what
          remedy do Shrestha & Fu propose in "Towards Identifiable Unsupervised Domain Translation"?
        expected_output: >-
          Shrestha & Fu (ICLR 2024): distribution matching criteria admit multiple solutions because of
          measure-preserving automorphisms (MPA) of the domains, so CycleGAN and variants can learn
          content-misaligned translations. Their MPA elimination theory shows MPA is unlikely to exist
          if multiple pairs of diverse cross-domain conditional distributions are matched; the learner
          (diversified distribution matching) matches distributions over auxiliary-variable-induced
          subsets of the domains rather than over the whole domains, giving translation identifiability.
        must_include: [["measure-preserving automorphism", "MPA"], ["conditional", "subsets", "auxiliary"], ["identifiab", "recover"]]
        expected_tools: [search_papers]
        reference_docs: [shrestha2024towards]

  - id: S15-flow-matching-ot-path-ru
    type: single
    difficulty: easy
    category: fact_lookup
    source: own
    language: ru
    turns:
      - user: >-
          Какой «OT»-условный путь вероятностей предлагают Lipman et al. в «Flow Matching for Generative
          Modeling»? Выпиши mu_t, sigma_t, условное векторное поле и поток.
        expected_output: >-
          Lipman et al. 2023 (ICLR), OT conditional path: mu_t(x) = t x_1, sigma_t(x) = 1 - (1 -
          sigma_min) t; поле u_t(x|x_1) = (x_1 - (1 - sigma_min) x) / (1 - (1 - sigma_min) t); поток
          psi_t(x) = (1 - (1 - sigma_min) t) x + t x_1 (прямолинейные траектории с постоянной
          скоростью).
        must_include: [["sigma_{\\text{min}}", "sigma_min", "σ_min", "\\sigma_{\\min}", "σmin"], ["t x_1", "tx_1", "t x₁", "tx_{1}", "t\\,x_1"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [lipman2022flow]

  - id: S16-dtm-stability-computation
    type: single
    difficulty: medium
    category: fact_lookup_with_computation
    source: own
    language: en
    turns:
      - user: >-
          Find the stability theorem for the distance function to a measure (Chazal, Cohen-Steiner &
          Merigot). If the mass parameter is m0 = 0.04 and W_2(mu, mu') = 0.01, what is the largest
          possible sup-norm difference between the two distance functions?
        expected_output: >-
          Chazal, Cohen-Steiner & Merigot 2011, Theorem 3.5 (distance function stability):
          ||d_{mu,m0} - d_{mu',m0}||_inf <= m0^{-1/2} W_2(mu, mu'). With m0 = 0.04: m0^{-1/2} = 5, bound
          = 5 * 0.01 = 0.05. The original paper IS in the corpus (chazal2011geometric, an OCR-noisy PDF
          that ranks low in search; list_documents("Geometric Inference") finds it); restatements in
          Buchet et al. 2015 (Theorem 3.3), Anai et al. 2018 (Prop. 4.2) or Chazal et al. 2018 (JMLR)
          are acceptable if cited as such. Claiming that the original is not in the corpus is an error.
        must_include: [["0.05"], ["3.5", "3.3", "4.2"]]
        expected_tools: [search_papers, list_documents, calculator]
        reference_docs: [chazal2011geometric, buchet2013efficient, anai2018dtmbased]

  # ------------------------------------------------------------------ dialogs
  - id: D01-dtm-short
    type: dialog
    difficulty: medium
    category: dialog_followup
    source: thesis
    language: en
    turns:
      - user: What is the distance to a measure (DTM) and which paper in the corpus introduced it?
        expected_output: >-
          Chazal, Cohen-Steiner & Merigot 2011, "Geometric Inference for Probability Measures",
          Definition 3.2: for a probability measure mu and mass parameter m0 in (0,1), d_{mu,m0}(x) is the
          (L2) average of the distances from x to the nearest mass m0 of mu, i.e.
          d_{mu,m0}^2(x) = (1/m0) int_0^{m0} delta_{mu,m}(x)^2 dm, where delta_{mu,m}(x) is the radius
          of the smallest ball around x of mass m. Motivation: robustness to outliers.
        must_include: [["Chazal"], ["Geometric Inference", "2011"], ["m0", "m_0", "mass parameter", "mass m"]]
        expected_tools: [search_papers]
        reference_docs: [chazal2011geometric]
      - user: What stability property does it have with respect to the measure?
        depends_on_history: true
        expected_output: >-
          Theorem 3.5: ||d_{mu,m0} - d_{mu',m0}||_inf <= m0^{-1/2} W_2(mu, mu') ("it" = the DTM from the
          previous turn); also 1-Lipschitz in x and d^2 is 1-semiconcave (Corollary 3.7).
        must_include: [["W_2", "W2", "Wasserstein"], ["m0^{-1/2}", "m_0^{-1/2}", "1/sqrt(m0)", "m^{-1/2}", "\\sqrt{m_0}", "√m0"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [chazal2011geometric]
      - user: And how do Anai et al. turn it into a filtration? What is the role of p?
        depends_on_history: true
        expected_output: >-
          Anai et al. 2018 "DTM-based filtrations": weighted Cech and Rips filtrations V[X,f] with
          f = DTM; each point x gets a radius function r_x(t) = (t^p - f(x)^p)^{1/p} for t >= f(x)
          (p in [1, inf]; p = inf gives r_x(t) = t). p controls how the weight enters: larger p leads to
          sparser 0-dim diagrams (Prop. 3.6). Stability: Prop. 4.3,
          d_i <= m^{-1/2} W_2(mu,nu) + 2^{1/p} d_H(X,Y).
        must_include: [["weighted"], ["(t^p - f(x)^p)^{1/p}", "t^{p}-f(x)^{p}", "t^p-f(x)^p", "radius function", "r_x(t)"], ["2^{1/p}", "2^{\\frac{1}{p}}", "2^(1/p)"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [anai2018dtmbased]

  - id: D02-gw-embeddings-wl
    type: dialog
    difficulty: hard
    category: dialog_followup
    source: thesis
    language: en
    turns:
      - user: >-
          Is there a paper in the corpus that aligns word embeddings of two languages with
          Gromov-Wasserstein? What do they do and what do they report?
        expected_output: >-
          Alvarez-Melis & Jaakkola, "Gromov-Wasserstein Alignment of Word Embedding Spaces" (EMNLP 2018):
          compare intra-language similarity (cosine cost) matrices with entropic GW (Peyre et al. 2016
          algorithm, L2 loss); performs on par with state-of-the-art neural (adversarial) methods on
          benchmark word translation at a fraction of the computational cost and hyper-parameter tuning.
