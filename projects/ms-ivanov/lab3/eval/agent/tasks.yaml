  - id: D08-identifiability-review-long-ru
    type: dialog
    difficulty: hard
    category: long_dialog
    source: thesis
    language: ru
    long_dialog: true
    turns:
      - user: >-
          Почему CycleGAN может выучить неправильное соответствие между доменами? Найди в корпусе работу
          про идентифицируемость непарного перевода доменов.
        expected_output: >-
          Shrestha & Fu, «Towards Identifiable Unsupervised Domain Translation: A Diversified Distribution
          Matching Approach» (ICLR 2024): из-за измеро-сохраняющих автоморфизмов (MPA) у критерия
          сопоставления распределений много решений, поэтому CycleGAN может давать перевод с нарушением
          содержания.
        must_include: [["Shrestha"], ["MPA", "measure-preserving", "сохраняющ"]]
        expected_tools: [search_papers]
        reference_docs: [shrestha2024towards]
      - user: Какое условие они предлагают, чтобы исключить MPA?
        depends_on_history: true
        expected_output: >-
          Сопоставлять не одно распределение, а несколько пар разнообразных условных распределений
          (подмножества доменов, индуцированные вспомогательной переменной); теория исключения MPA:
          при достаточном разнообразии MPA маловероятны, перевод идентифицируем.
        must_include: [["услов", "conditional", "подмнож", "auxiliary", "вспомогат"]]
        expected_tools: [search_papers, get_chunk_context]
        reference_docs: [shrestha2024towards]
      - user: А есть ли у тех же авторов работа про flow matching?
        depends_on_history: true
        expected_output: >-
          Да: Shrestha & Fu, «Diversified Flow Matching with Translation Identifiability» (ICML 2025).
          (Также у них есть «Content-Style Learning from Unaligned Domains», ICLR 2025, и с соавторами
          «Domain Transfer Becomes Identifiable via a Single Alignment», ICML 2026.)
        must_include: [["Diversified Flow Matching"]]
        expected_tools: [list_documents, search_papers]
        reference_docs: [shrestha2025diversified]
      - user: Какой вес у cycle-consistency loss в оригинальном CycleGAN?
        expected_output: lambda = 10 (Zhu et al. 2017, все эксперименты; Adam, batch size 1, lr 0.0002).
        must_include: [["10"]]
        expected_tools: [search_papers]
        reference_docs: [zhu2017unpaired]
      - user: Какой подход предлагают Alvarez-Melis и Jaakkola для выравнивания эмбеддингов слов без пар?
        expected_output: >-
          Энтропийный Gromov-Wasserstein между матрицами внутриязыковых (косинусных) расстояний; для
          больших словарей — GW на подмножестве и затем ортогональное отображение (Procrustes);
          качество на уровне SOTA при меньших вычислениях.
        must_include: [["Gromov"], ["Procrustes", "Прокруст", "ортогон"]]
        expected_tools: [search_papers]
        reference_docs: [alvarezmelis2018gromovwasserstein]
      - user: Чем отличается подход Schnaus et al. 2026?
        expected_output: >-
          «Shared Geometry As A Rosetta Stone»: Wasserstein Procrustes с грубой геометрической
          инициализацией; одно ортогональное отображение между независимо обученными мультимодальными
          представлениями без пар; стандартные метрики геометрического сходства предсказывают, когда это
          возможно; при очень малом числе пар превосходит существующие методы.
        must_include: [["Procrustes", "Прокруст"], ["инициализ", "initializ"]]
        expected_tools: [search_papers]
        reference_docs: [schnaus2026shared]
      - user: Как устроены два уровня в иерархическом OT Lee et al.?
        expected_output: >-
          Lee et al. 2019: внешний уровень — соответствие кластеров P в многограннике Биркгофа, внутренний
          — W_2^2 между кластерами после общего преобразования на многообразии Штифеля; энтропийная
          регуляризация, распределённый ADMM (HiWA).
        must_include: [["Birkhoff", "Биркгоф"], ["Stiefel", "Штифел", "Стифел", "ортогон"]]
        expected_tools: [search_papers]
        reference_docs: [lee2019hierarchical]
      - user: >-
          Сравни с моей постановкой: дискретный уровень — перестановка компонент по топологическим
          сигнатурам, непрерывный — оптимальная карта для строго выпуклой стоимости внутри компоненты.
          Где совпадение, где разница?
        depends_on_history: true
        expected_output: >-
          Совпадение: два уровня (кластеры/компоненты, затем точки). Разница: Lee et al. — мягкое
          соответствие кластеров по стоимости W_2 после общей изометрии, без топологии; у пользователя —
          соответствие по сигнатурам (масса, дыры, persistence), внутри — единственная карта строго
          выпуклой стоимости, без общего ортогонального ограничения.
        must_include: [["сигнатур", "signature", "топол"], ["Штифел", "Стифел", "Stiefel", "ортогон", "изометр", "W_2", "Вассерштейн", "Wasserstein"]]
        expected_tools: []
        reference_docs: [lee2019hierarchical]
      - user: >-
          Вернись к первой статье, которую ты нашёл в этом разговоре: как называется явление, из-за
          которого CycleGAN ошибается, кто авторы и где она опубликована?
        depends_on_history: true
        memory_probe: true
        expected_output: >-
          Measure-preserving automorphism (MPA); Sagar Shrestha и Xiao Fu; ICLR 2024.
        must_include: [["MPA", "measure-preserving", "сохраняющ"], ["Shrestha"], ["ICLR", "2024"]]
        expected_tools: []
        reference_docs: [shrestha2024towards]
      - user: >-
          Составь итоговую таблицу всех работ из разговора: работа, год, нужны ли парные данные, что
          гарантируется или показывается.
        depends_on_history: true
        memory_probe: true
        expected_output: >-
          Shrestha & Fu 2024 (без пар; идентифицируемость при diversified distribution matching);
          Shrestha & Fu 2025 (Diversified Flow Matching); Zhu et al. 2017 CycleGAN (без пар;
          гарантий нет, lambda = 10); Alvarez-Melis & Jaakkola 2018 (без пар; GW, на уровне SOTA);
          Schnaus et al. 2026 (без пар или очень мало пар; Wasserstein Procrustes); Lee et al. 2019
          (без пар, кластеры; гарантии восстановления соответствия кластеров).
        must_include: [["Shrestha"], ["CycleGAN", "Zhu"], ["Alvarez"], ["Schnaus"], ["Lee"]]
        expected_tools: []
        reference_docs: []
