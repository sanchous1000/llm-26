name: lab3-langfuse

services:
  langfuse-web:
    ports: !override
      - "127.0.0.1:3000:3000"
  minio:
    ports: !override
      - "127.0.0.1:9090:9000"
  langfuse-worker:
    ports: !reset []
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  clickhouse:
    ports: !reset []
  langfuse-ai-gateway:
    profiles: ["gateway"]
    ports: !reset []