sources:
  dir: docs
  reparse: false

splitter:
  chunk_size: 512
  chunk_overlap: 50
  header_levels: 3

embedding:
  vectorization: dense       # dense | hybrid
  model: ai-forever/FRIDA
  device: auto
  batch_size: 16
  max_seq_length: 512
  normalize: true
  query_prefix: "search_query: "
  document_prefix: "search_document: "
  sparse:
    k1: 1.5
    b: 0.75

index:
  type: hnsw
  hnsw:
    M: 32
    ef_construction: 200
    ef_search: 64
  quantization: none
  dir: faiss

rag:
  collection: null           # null = активная из artifacts/faiss/active.json
  top_n: 5
  rrf_k: 60                  # знаменатель RRF: 1 / (rrf_k + rank)
  max_context_tokens: 3000
  snippet_chars: 240

llm:
  base_url: http://127.0.0.1:8000/v1
  model: auto
  temperature: 0.1
  top_p: 0.9
  max_tokens: 700
  repetition_penalty: 1.15
  timeout_s: 120

artifacts:
  dir: artifacts
