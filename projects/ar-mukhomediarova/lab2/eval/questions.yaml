  - id: q07
    question: Как выполняется лемматизация для русского языка и что делается с китайским и японским текстом?
    answer: Для русского — spaCy ru_core_news_sm; для zh и ja — посимвольная токенизация без spaCy.
    key_facts: ["ru_core_news_sm", "посимвольн"]
    relevant:
      - {doc: "Семестр II / Мухомедьярова", section: "Токенизация, лемматизация", contains: ["ru_core_news_sm", "ru\\_core\\_news\\_sm"]}

  - id: q08
    question: Какие пять актуальных проблем области выделены в аналитическом обзоре литературы?
    answer: >-
      Качество семантического сходства на уровне тем; масштабируемость и вычислительная стоимость;
      мультилингвальность и доменная адаптация; интерпретируемость; компромисс качество/скорость при реранжировании.
    key_facts: ["масштабируем", "мультилингв", "интерпретируем", "reranker|реранж"]
    relevant:
      - {section: "Пять актуальных проблем"}

  - id: q09
    question: Почему гибридные dense+sparse подходы названы в обзоре перспективным направлением?
    answer: >-
      Sparse-методы явно учитывают терминологию (редкие слова, предметные термины), а dense —
      семантику при перефразировании; их сочетание объединяет преимущества.
    key_facts: ["термин", "перефраз|семант"]
    relevant:
      - {section: "Гибридные dense+sparse"}

  - id: q10
    question: Какие этапы протокола PRISMA применялись при отборе источников для обзора?
    answer: Идентификация источников, удаление дубликатов, скрининг по аннотациям и ключевым словам, оценка полных текстов, включение в финальный набор.
    key_facts: ["дубликат", "скрининг", "полнотекст|полных текст"]
    relevant:
      - {doc: "Семестр I", section: "PRISMA"}

  - id: q11
    question: По каким критериям источник включался в итоговый список литературы?
    answer: Соответствие тематике, научная основа, наличие экспериментов, актуальность (не старше 5 лет), практическая применимость.
    key_facts: ["тематик", "эксперимент", "5 лет"]
    relevant:
      - {doc: "Семестр I", section: "Критерии отбора источников", contains: ["включался"]}

  - id: q12
    question: Какова тема и цель НИР в третьем семестре?
    answer: >-
      Кластеризация текстовых данных статей: проверка гипотез об анизотропной декомпенсации и семантической
      неоднородности эмбеддингов; цель — исследовать их влияние на качество кластеризации и разработать диагностические критерии.
    key_facts: ["анизотроп", "неоднородн"]
    relevant:
      - - {doc: "Семестр III / Задание к НИР"}
        - {doc: "НИР План", section: "Семестр III", contains: ["анизотроп"]}

  - id: q13
    question: Как планируется проверять гипотезу об анизотропной декомпенсации?
    answer: >-
      Корпус разбивается по длине на диапазоны; для каждого измеряется анизотропия (средний косинус между
      случайными парами), выполняется кластеризация K-Means и Agglomerative, метрики сопоставляются с анизотропией,
      ищется точка перелома и проверяется эффект нормировки.
    key_facts: ["длин", "средний косинус", "K-Means", "точк"]
    relevant:
      - - {doc: "Семестр III / Задание к НИР", contains: ["анизотропной декомпенсации"]}
        - {doc: "НИР План", section: "Семестр III", contains: ["критической длины"]}
        - {doc: "НИР План", section: "Гипотезы", contains: ["Анизотропная декомпенсация"]}

  - id: q14
    question: Какие сроки и задачи у этапа разработки пайплайна предобработки текстов во втором семестре?
