  # ---- статьи-источники по гипотезам (PDF, англ.): вопрос по-русски → ответ из английского текста
  - id: a01
    question: К какому выводу приходят авторы статьи «Is Anisotropy Truly Harmful?» о влиянии анизотропии на качество кластеризации?
    answer: Влияние анизотропии на выразительность представлений ограничено — и по направлениям, и по L2-близости; проверяется через задачу кластеризации.
    key_facts: ["огранич|limited|незначител|слаб", "кластериз"]
    relevant:
      - {doc: "Is Anisotropy", contains: ["limited impact of anisotropy"]}

  - id: a02
    question: Что, по мнению авторов статьи Pooling and Semantic Shift, является главной причиной коллапса эмбеддингов длинных текстов?
    answer: >-
      Не длина текста сама по себе, а операция пулинга в сочетании с внутренним семантическим сдвигом (semantic shift);
      анизотропия вредна, только когда вызвана сильным семантическим сдвигом.
    key_facts: ["pooling|пулинг", "shift|сдвиг"]
    relevant:
      - {doc: "Pooling and Semantic Shift", contains: ["primary predictor", "fundamental drivers"]}

  - id: a03
    question: Насколько REALM улучшает NDCG@10 и сокращает число вызовов LLM по сравнению с другими реранкерами?
    answer: NDCG@10 выше на 0,7–11,9, число инференсов LLM меньше на 23,4–84,4 %.
    key_facts: ["11.9", "84.4"]
    relevant:
      - {doc: "REALM", contains: ["84.4"]}

  - id: a04
    question: Как в статье о внутреннем аудите выявляются нетипичные документы и какой алгоритм кластеризации используется?
    answer: >-
      Документ-специфичная оценка — отрицательная лог-предсказательная плотность (LOO) по Дирихле-мультиномиальной модели;
      байесовские эмбеддинги со сглаживанием Дирихле кластеризуются DBSCAN, нетипичные — точки низкой плотности.
    key_facts: ["DBSCAN", "Дирихле|Dirichlet"]
    relevant:
      - {doc: "Bayesian semantic structure", contains: ["DBSCAN"], section: "Abstract"}
      - {doc: "Bayesian semantic structure", section: "Bayesian document embedding and DBSCAN"}
