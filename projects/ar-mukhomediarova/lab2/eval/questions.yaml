# Оценочные вопросы с эталонной разметкой релевантных фрагментов.
#
# relevant — список «групп релевантности»; группа — один спец или список альтернатив
# (дубли одного и того же текста в разных документах засчитываются как одно место).
# Спец описывает место в корпусе независимо от чанкинга, поэтому годится для любой конфигурации:
#   doc:      подстрока названия/пути документа
#   section:  подстрока пути заголовков чанка («Раздел > Подраздел»)
#   contains: чанк содержит хотя бы одну из строк (без учёта регистра)
#   pages:    [от, до] — пересечение со страницами чанка (для PDF)
# Все заданные поля спеца должны выполняться одновременно.
# key_facts — факты, которые должны быть в ответе LLM (для оценки QA).

questions:
  - id: q01
    question: Какие целевые значения Silhouette и Davies–Bouldin заданы в критериях приёмки ТЗ?
    answer: Silhouette ≥ 0.4 и Davies–Bouldin ≤ 1.0 хотя бы для одного метода векторизации.
    key_facts: ["0.4", "1.0"]
    relevant:
      - - {doc: "Техническое задание", section: "Критерии приёмки"}
        - {doc: "Семестр II / Мухомедьярова", section: "Техническое задание", contains: ["Silhouette ≥ 0.4"]}
      - - {doc: "Техническое задание", section: "Метрики"}
        - {doc: "Семестр II / Мухомедьярова", section: "Техническое задание", contains: ["целевое значение ≥ 0.4"]}

  - id: q02
    question: Какие методы векторизации текстов должны быть реализованы по техническому заданию?
    answer: FastText, Doc2Vec, BERT, Sentence-BERT, BGE-M3, E5, GTE (семь методов).
    key_facts: ["FastText", "Doc2Vec", "BERT", "BGE-M3", "E5", "GTE"]
    relevant:
      - - {doc: "Техническое задание", section: "Цели и задачи"}
        - {doc: "Техническое задание", section: "Критерии приёмки"}
        - {doc: "Техническое задание", section: "Предмет работы"}
        - {doc: "Семестр II / Мухомедьярова", section: "Техническое задание", contains: ["FastText, Doc2Vec"]}

  - id: q03
    question: Какие минимальные требования к вычислительной среде указаны в ТЗ?
    answer: 16 CPU, 64 GB RAM, 1 GPU 8–12 GB (или облачный эквивалент), диск 1 TB, vector DB и PostgreSQL.
    key_facts: ["16 CPU", "64 GB", "1 TB"]
    relevant:
      - - {doc: "Техническое задание", section: "Системные требования"}
        - {doc: "Семестр II / Мухомедьярова", contains: ["16 CPU, 64 GB RAM"]}

