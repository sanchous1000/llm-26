# Qdrant для лабораторной 2: docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-lab2
    ports:
      - "6333:6333"   # REST + веб-интерфейс: http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
